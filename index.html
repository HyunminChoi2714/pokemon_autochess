<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 오토체스 (Pokemon Auto Chess)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-container {
            width: 1050px;
            background: #16213e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 20px;
        }
        .main-panel { display: flex; flex-direction: column; gap: 16px; }
        .side-panel { display: flex; flex-direction: column; gap: 16px; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #0f3460;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid #1f4287;
        }
        .stat-item { display: flex; align-items: center; gap: 6px; }

        .board-wrapper {
            background: #0f3460;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .board-title { font-size: 13px; color: #00fff0; text-align: center; font-weight: bold; }
        
        .board-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }
        .grid-4x4 { height: 200px; }
        .grid-8x4 { height: 400px; grid-template-rows: repeat(8, 1fr); }

        .grid-cell {
            background: #1a1a2e;
            border: 2px dashed #3a4768;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            padding: 4px;
        }
        .grid-cell:hover { border-color: #00fff0; background: #223254; }
        .grid-cell.selected { border: 2px solid #f9d56e; background: rgba(249, 213, 110, 0.25); box-shadow: 0 0 10px #f9d56e; }

        .enemy-cell { background: #2a1b2a; border-style: solid; border-color: #532e53; cursor: default; }
        .player-cell { background: #1b2a2a; border-style: solid; border-color: #2e5353; }
        .battle-cell { border-style: solid; border-color: #333; }
        .battle-cell.enemy-side { background: #2a1b2a; }
        .battle-cell.player-side { background: #1b2a2a; }

        .pokemon-img { width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        .slot-pokemon-img { width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .unit-name { font-size: 11px; margin-top: 2px; font-weight: bold; }
        .stars { color: #f9d56e; font-size: 11px; font-weight: bold; }
        .empty-text { font-size: 11px; color: #555; }

        .hp-bar-bg { width: 85%; height: 5px; background: #333; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .hp-bar-fg { height: 100%; background: #4eef90; transition: width 0.3s; }

        .bench-wrapper { background: #0f3460; padding: 14px; border-radius: 12px; }
        .bench-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
        .bench-slot {
            height: 70px;
            background: #1a1a2e;
            border: 2px solid #3a4768;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .bench-slot:hover { border-color: #00fff0; background: #223254; }
        .bench-slot.selected { border-color: #f9d56e; background: rgba(249, 213, 110, 0.25); box-shadow: 0 0 10px #f9d56e; }

        .shop-wrapper { background: #0f3460; padding: 16px; border-radius: 12px; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .shop-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .shop-card {
            background: #1a1a2e;
            border: 2px solid #00fff0;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .shop-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,255,240,0.3); }
        .shop-card.disabled { border-color: #444; opacity: 0.5; cursor: not-allowed; }
        .sold-out { font-size: 12px; color: #888; padding: 30px 0; }

        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-reroll { background: #e94560; color: white; }
        .btn-reroll:hover { background: #ff5773; }
        .btn-xp { background: #16213e; border: 1px solid #00fff0; color: #00fff0; }
        .btn-xp:hover { background: #00fff0; color: black; }
        .btn-battle { background: #4eef90; color: black; font-size: 16px; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; }
        .btn-battle:hover { background: #6bffab; box-shadow: 0 0 15px rgba(78,239,144,0.4); }

        .card-box { background: #0f3460; padding: 16px; border-radius: 12px; }
        .box-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #00fff0; }
        .log-box { height: 240px; overflow-y: auto; background: #1a1a2e; padding: 10px; border-radius: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
        .log-box p { border-bottom: 1px solid #252e42; padding-bottom: 4px; color: #ddd; }
        .syn-badge { display: inline-block; background: #e94560; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin: 3px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-panel">
            <div class="status-bar">
                <div class="stat-item">❤️ HP: <span id="player-hp">100</span></div>
                <div class="stat-item">💰 Gold: <span id="player-gold">10</span></div>
                <div class="stat-item">⭐ Level: <span id="player-level">1</span> (<span id="player-xp">0/4</span>)</div>
                <div class="stat-item">⚔️ Round: <span id="round-num">1</span></div>
                <div class="stat-item">♟️ 배치: <span id="unit-count">0/1</span></div>
            </div>

            <div class="board-wrapper">
                <div id="enemy-area-wrapper">
                    <div class="board-title">▲ 적 전장 (상대)</div>
                    <div class="board-grid grid-4x4" id="enemy-board-grid"></div>
                </div>

                <div id="player-area-wrapper">
                    <div class="board-title" style="margin-top: 6px;">▼ 플레이어 전장 (클릭 시 선택 및 이동)</div>
                    <div class="board-grid grid-4x4" id="player-board-grid"></div>
                </div>

                <div id="battle-area-wrapper" style="display: none;">
                    <div class="board-title">⚔️ 전투 진행 중</div>
                    <div class="board-grid grid-8x4" id="battle-board-grid"></div>
                </div>
            </div>

            <div class="bench-wrapper">
                <div class="board-title" style="margin-bottom: 8px;">대기석 (최대 8마리 보유)</div>
                <div class="bench-grid" id="bench-container"></div>
            </div>

            <div class="shop-wrapper">
                <div class="shop-header">
                    <span style="font-weight: bold; color: #00fff0;">🛒 포켓몬 상점</span>
                    <div>
                        <button class="btn btn-xp" onclick="game.buyXp()">경험치 구매 (4G)</button>
                        <button class="btn btn-reroll" onclick="game.rerollShop()">상점 새로고침 (2G)</button>
                    </div>
                </div>
                <div class="shop-grid" id="shop-container"></div>
            </div>
        </div>

        <div class="side-panel">
            <button class="btn btn-battle" onclick="game.startBattle()">⚔️ 전투 시작!</button>
            
            <div class="card-box">
                <div class="box-title">🔥 타입 시너지</div>
                <div id="synergy-list"></div>
            </div>

            <div class="card-box" style="flex: 1; display: flex; flex-direction: column;">
                <div class="box-title">📜 전투 / 진행 로그</div>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>
    </div>

    <script src="pokemon_autochess.js"></script>
</body>
</html>
